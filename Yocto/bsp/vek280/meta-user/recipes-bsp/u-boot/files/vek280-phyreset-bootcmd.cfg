# Release the Ethernet FMC Max PHY resets before every boot (ported from
# the PetaLinux BSP's platform-top.h "phy_reset", same register writes;
# u-boot cfg mechanism copied from the 2x-qsfp28-fmc vck190 Yocto BSP).
# VADJ is on by default on this board, so no VADJ enable is needed (the
# PetaLinux BSP has none either).
#
# The four active-low PHY resets are FMC I/Os driven by PMC GPIO bank 3
# (EMIO): set them as outputs (DIRM 0xf10202c4, OEN 0xf10202c8), drive LOW
# for 0.2 s, then HIGH (DATA 0xf102004c). Without it the PHYs are never given
# a clean reset after the bitstream is loaded and the FMC ports may stay dead.
CONFIG_BOOTCOMMAND="mw 0xf10202c4 0x0000000f; mw 0xf10202c8 0x0000000f; mw 0xf102004c 0x00000000; sleep 0.2; mw 0xf102004c 0x0000000f; run distro_bootcmd"
