# Enable VADJ before every boot (ported from the PetaLinux BSP's
# platform-top.h "vadj_1v5_en", same register values; mechanism copied from
# the HW-verified 2x-qsfp28-fmc vck190 Yocto BSP).
#
# On VMK180 the FMC VADJ rail comes from the IR38164 buck regulator
# (I2C addr 0x1E behind mux 0x74 channel 0 on LPD I2C0). Normally the system
# controller enables it, but it is too slow / may be unconfigured: without
# this, VADJ is still off when Linux probes the FMC, so the FMC devices are
# dead at probe (FMC I2C scans empty, GT/PHY never come up).
#
# "i2c dev 0": the EDF u-boot numbers I2C buses by the SDT /aliases, so
# LPD I2C0 (ff020000) is bus 0 here: this design has no PL AXI IIC,
# so the SDT aliases LPD I2C0 as i2c0 (checked in a built u-boot DTB).
# This differs per design (2x-qsfp28-fmc: bus 3); re-check the aliases if the design's I2C controllers change.
# The write sequence programs the 1.5V VADJ profile and sets the enable bit
# (0x22=0x80) last.
#
# Then release the Ethernet FMC Max PHY resets (PetaLinux "phy_reset"): the
# four active-low PHY resets are FMC I/Os driven by PMC GPIO bank 3 (EMIO);
# set them as outputs (DIRM 0xf10202c4, OEN 0xf10202c8), drive LOW for 0.2 s,
# then HIGH (DATA 0xf102004c). The resets are ineffective until VADJ is up,
# so this must run after the VADJ enable (same order as PetaLinux).
# Without it the PHYs never see a valid reset once their I/O bank is
# powered, and the FMC ports may not come up.
CONFIG_CMD_I2C=y
CONFIG_BOOTCOMMAND="i2c dev 0; i2c mw 0x74 0x00.0 0x01 0x1; i2c mw 0x1E 0x24.1 0x01 0x1; i2c mw 0x1E 0x25.1 0x80 0x1; i2c mw 0x1E 0x3A.1 0x01 0x1; i2c mw 0x1E 0x3B.1 0xF3 0x1; i2c mw 0x1E 0x3D.1 0x01 0x1; i2c mw 0x1E 0x3E.1 0xF3 0x1; i2c mw 0x1E 0x3F.1 0x00 0x1; i2c mw 0x1E 0x40.1 0x00 0x1; i2c mw 0x1E 0x41.1 0x00 0x1; i2c mw 0x1E 0x42.1 0x00 0x1; i2c mw 0x1E 0x22.1 0x80 0x1; mw 0xf10202c4 0x0000000f; mw 0xf10202c8 0x0000000f; mw 0xf102004c 0x00000000; sleep 0.2; mw 0xf102004c 0x0000000f; run distro_bootcmd"
